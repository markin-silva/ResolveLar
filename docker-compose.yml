name: resolvelar

x-postgres: &postgres
  image: postgres:16-alpine
  restart: unless-stopped
  networks: [internal_net]
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 10s
    timeout: 3s
    retries: 5

services:
  # ---------- Gateway ----------
  kong:
    image: kong:3.6
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /tmp/kong.yml
      # O segredo do JWT vem do ambiente; o kong.yml é gerado a partir do template abaixo.
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    entrypoint: ["sh", "-c", "sed \"s|__JWT_SECRET__|$$JWT_SECRET|g\" /kong/kong.tpl.yml > /tmp/kong.yml && exec /docker-entrypoint.sh kong docker-start"]
    volumes:
      - ./gateway/kong.tpl.yml:/kong/kong.tpl.yml:ro
    ports:
      - "8000:8000"
      - "127.0.0.1:8001:8001"
    networks: [edge_net, internal_net]
    depends_on:
      redis:
        condition: service_healthy
      bff-contratante:
        condition: service_healthy
      bff-prestador:
        condition: service_healthy
      ms-auth:
        condition: service_healthy

  # ---------- BFFs (sem banco próprio; só a rede interna) ----------
  bff-contratante:
    build: ./services/bff-contratante
    image: resolvelar/bff-contratante:latest
    restart: unless-stopped
    environment:
      SERVICE_NAME: bff-contratante
      ENABLE_UPSTREAM_MOCK: ${ENABLE_UPSTREAM_MOCK:-true}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-3}
      MS_PRESTADORES_URL: ${MS_PRESTADORES_URL}
      MS_SOLICITACOES_URL: ${MS_SOLICITACOES_URL}
      MS_PAGAMENTOS_URL: ${MS_PAGAMENTOS_URL}
      MS_AVALIACOES_URL: ${MS_AVALIACOES_URL}
      MS_TRIAGEM_URL: ${MS_TRIAGEM_URL:-http://ms-triagem:8000}
    networks: [internal_net]

  bff-prestador:
    build: ./services/bff-prestador
    image: resolvelar/bff-prestador:latest
    restart: unless-stopped
    environment:
      SERVICE_NAME: bff-prestador
      ENABLE_UPSTREAM_MOCK: ${ENABLE_UPSTREAM_MOCK:-true}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-3}
      MS_SOLICITACOES_URL: ${MS_SOLICITACOES_URL}
      MS_AGENDAMENTOS_URL: ${MS_AGENDAMENTOS_URL}
      MS_PAGAMENTOS_URL: ${MS_PAGAMENTOS_URL}
      MS_PRESTADORES_URL: ${MS_PRESTADORES_URL}
    networks: [internal_net]

  # ---------- Frente 2: SAGA e transações ----------
  ms-solicitacoes:
    build: ./services/ms-solicitacoes
    image: resolvelar/ms-solicitacoes:latest
    restart: unless-stopped
    environment:
      SERVICE_NAME: ms-solicitacoes
      DATABASE_URL: ${DATABASE_URL_SOLICITACOES}
      RABBITMQ_URL: ${RABBITMQ_URL}
      MS_AGENDAMENTOS_URL: http://ms-agendamentos:8000
      MS_PAGAMENTOS_URL: http://ms-pagamentos:8000
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-3}
    networks: [internal_net]
    depends_on:
      db-solicitacoes:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ms-agendamentos:
    build: ./services/ms-agendamentos
    image: resolvelar/ms-agendamentos:latest
    restart: unless-stopped
    environment:
      SERVICE_NAME: ms-agendamentos
      DATABASE_URL: ${DATABASE_URL_AGENDAMENTOS}
    networks: [internal_net]
    depends_on:
      db-agendamentos:
        condition: service_healthy

  ms-pagamentos:
    build: ./services/ms-pagamentos
    image: resolvelar/ms-pagamentos:latest
    restart: unless-stopped
    environment:
      SERVICE_NAME: ms-pagamentos
      DATABASE_URL: ${DATABASE_URL_PAGAMENTOS}
      RABBITMQ_URL: ${RABBITMQ_URL}
    networks: [internal_net]
    depends_on:
      db-pagamentos:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ---------- Infra ----------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks: [internal_net]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [internal_net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------- Bancos (database per service) ----------
  db-prestadores-write:
    <<: *postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_PRESTADORES_WRITE}
      POSTGRES_DB: prestadores_write
    volumes:
      - pg_prestadores_write:/var/lib/postgresql/data

  db-prestadores-read:
    <<: *postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_PRESTADORES_READ}
      POSTGRES_DB: prestadores_read
    volumes:
      - pg_prestadores_read:/var/lib/postgresql/data

  db-solicitacoes:
    <<: *postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_SOLICITACOES}
      POSTGRES_DB: solicitacoes
    volumes:
      - pg_solicitacoes:/var/lib/postgresql/data

  db-agendamentos:
    <<: *postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_AGENDAMENTOS}
      POSTGRES_DB: agendamentos
    volumes:
      - pg_agendamentos:/var/lib/postgresql/data

  db-pagamentos:
    <<: *postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_PAGAMENTOS}
      POSTGRES_DB: pagamentos
    volumes:
      - pg_pagamentos:/var/lib/postgresql/data

  db-avaliacoes:
    <<: *postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_AVALIACOES}
      POSTGRES_DB: avaliacoes
    volumes:
      - pg_avaliacoes:/var/lib/postgresql/data

  # ---------- Microsserviços (Frente 3: CQRS, avaliações e IA) ----------
  # ms-prestadores: CQRS (comandos -> write DB + outbox; projetor RabbitMQ -> read DB; consultas + Redis)
  ms-prestadores:
    build: ./services/ms-prestadores
    image: resolvelar/ms-prestadores:latest
    restart: unless-stopped
    environment:
      SERVICE_NAME: ms-prestadores
      DATABASE_URL_WRITE: ${DATABASE_URL_PRESTADORES_WRITE}
      DATABASE_URL_READ: ${DATABASE_URL_PRESTADORES_READ}
      RABBITMQ_URL: ${RABBITMQ_URL}
      REDIS_URL: ${REDIS_URL}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    networks: [internal_net]
    depends_on:
      db-prestadores-write: {condition: service_healthy}
      db-prestadores-read: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_healthy}

  # ms-avaliacoes: publica AvaliacaoRegistrada (outbox) -> projetor do ms-prestadores atualiza notaMedia
  ms-avaliacoes:
    build: ./services/ms-avaliacoes
    image: resolvelar/ms-avaliacoes:latest
    restart: unless-stopped
    environment:
      SERVICE_NAME: ms-avaliacoes
      DATABASE_URL: ${DATABASE_URL_AVALIACOES}
      RABBITMQ_URL: ${RABBITMQ_URL}
      MS_SOLICITACOES_URL: ${MS_SOLICITACOES_URL}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    networks: [internal_net]
    depends_on:
      db-avaliacoes: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

  # ms-triagem: Assistente de Triagem (LangChain + ChromaDB embarcado + cache Redis + fallback).
  # É o único ms com saída para a internet (egress_net), para chamar a API do LLM.
  ms-triagem:
    build: ./services/ms-triagem
    image: resolvelar/ms-triagem:latest
    restart: unless-stopped
    environment:
      SERVICE_NAME: ms-triagem
      REDIS_URL: ${REDIS_URL}
      MS_PRESTADORES_URL: ${MS_PRESTADORES_URL}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      LLM_MODEL: ${LLM_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-4.5}
      LLM_TOTAL_BUDGET_SECONDS: ${LLM_TOTAL_BUDGET_SECONDS:-5}
    volumes:
      - chroma_data:/data/chroma
    networks: [internal_net, egress_net]
    depends_on:
      redis: {condition: service_healthy}
      ms-prestadores: {condition: service_healthy}

  # ---------- Autenticação (usuários fixos de demonstração) ----------
  # Emite o JWT que o Kong valida. Sem banco: a lista de usuários é fixa e a senha vem do ambiente.
  ms-auth:
    build: ./services/ms-auth
    image: resolvelar/ms-auth:latest
    restart: unless-stopped
    environment:
      SERVICE_NAME: ms-auth
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?defina DEMO_PASSWORD no .env}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-12}
    networks: [internal_net]

  # ---------- Frontends ----------
  web-contratante:
    build: ./clients/web-contratante
    image: resolvelar/web-contratante:latest
    restart: unless-stopped
    ports: ["3001:80"]
    networks: [edge_net]

  web-prestador:
    build: ./clients/web-prestador
    image: resolvelar/web-prestador:latest
    restart: unless-stopped
    ports: ["3002:80"]
    networks: [edge_net]

networks:
  edge_net:
    driver: bridge
  internal_net:
    driver: bridge
    internal: true
  # saída para a internet só para quem precisa de API externa (ms-triagem -> LLM)
  egress_net:
    driver: bridge

volumes:
  pg_prestadores_write:
  pg_prestadores_read:
  pg_solicitacoes:
  pg_agendamentos:
  pg_pagamentos:
  pg_avaliacoes:
  rabbitmq_data:
  chroma_data:
