# GERADO por scripts/sync-kong-configmap.sh a partir de gateway/kong.yml — não edite à mão.
# Contém as credenciais JWT DE TESTE definidas no kong.yml (demo local, sem provedor de identidade).
apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-config
  namespace: resolvelar
data:
  kong.yml: |
    # Kong 3.6 — modo DB-less. Espelha docs/02-gateway-e-bff.md.
    #
    # Identidade: após validar o JWT, o Kong injeta nos upstreams (BFFs):
    #   X-Consumer-Username  -> id do usuário (ex.: contratante_15, prest_17)
    #   X-Consumer-Groups    -> perfil/role vindo do plugin acl (contratante | prestador)
    #   X-Consumer-Id, X-Credential-Identifier -> ids internos do Kong
    # Os BFFs confiam nesses headers (só são acessíveis pela rede interna).
    #
    # ATENÇÃO: as credenciais JWT abaixo são DE TESTE LOCAL (demo sem provedor de
    # identidade). Em ambiente real, troque por segredos fora do Git.
    #
    # Após editar este arquivo: `scripts/sync-kong-configmap.sh` (regenera k8s/01-kong-config.yaml).
    _format_version: "3.0"
    _transform: true

    consumers:
      - username: contratante_15
        acls:
          - group: contratante
        jwt_secrets:
          - key: contratante-key
            secret: resolvelar-jwt-secret-2026
            algorithm: HS256

      - username: prest_17
        acls:
          - group: prestador
        jwt_secrets:
          - key: prestador-key
            secret: resolvelar-jwt-secret-2026
            algorithm: HS256

    services:
      # ------------------------------------------------------------------ contratante
      - name: bff-contratante
        url: http://bff-contratante:8000
        connect_timeout: 3000
        read_timeout: 10000
        write_timeout: 10000
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify: [exp]
          - name: acl
            config:
              allow: [contratante]
          # Limite padrão (leitura e demais rotas): 120/min por usuário
          - name: rate-limiting
            config:
              minute: 120
              limit_by: consumer
              policy: redis
              redis:
                host: redis
                port: 6379
                timeout: 2000
              fault_tolerant: true
        routes:
          # POST /v1/contratante/solicitacoes -> 10/hora (anti-spam aos prestadores).
          # Rota por regex: não usa strip_path (removeria o caminho todo); o
          # request-transformer reescreve a URI para /solicitacoes.
          - name: contratante-criar-solicitacao
            methods: [POST]
            paths:
              - "~/v1/contratante/solicitacoes/?$"
            strip_path: false
            plugins:
              - name: request-transformer
                config:
                  replace:
                    uri: /solicitacoes
              - name: rate-limiting
                config:
                  hour: 10
                  limit_by: consumer
                  policy: redis
                  redis:
                    host: redis
                    port: 6379
                    timeout: 2000
                  fault_tolerant: true
          # Demais rotas: o Kong remove o prefixo (BFF recebe /solicitacoes/sol_8f21)
          - name: contratante-geral
            paths:
              - /v1/contratante
            strip_path: true

      # ------------------------------------------------------------------ prestador
      - name: bff-prestador
        url: http://bff-prestador:8000
        connect_timeout: 3000
        read_timeout: 10000
        write_timeout: 10000
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify: [exp]
          - name: acl
            config:
              allow: [prestador]
          - name: rate-limiting
            config:
              minute: 120
              limit_by: consumer
              policy: redis
              redis:
                host: redis
                port: 6379
                timeout: 2000
              fault_tolerant: true
        routes:
          # POST /v1/prestador/solicitacoes/{id}/orcamentos -> 30/hora
          - name: prestador-enviar-orcamento
            methods: [POST]
            paths:
              - "~/v1/prestador/solicitacoes/(?<solicitacao_id>[^/]+)/orcamentos/?$"
            strip_path: false
            plugins:
              - name: request-transformer
                config:
                  replace:
                    uri: "/solicitacoes/$(uri_captures.solicitacao_id)/orcamentos"
              - name: rate-limiting
                config:
                  hour: 30
                  limit_by: consumer
                  policy: redis
                  redis:
                    host: redis
                    port: 6379
                    timeout: 2000
                  fault_tolerant: true
          - name: prestador-geral
            paths:
              - /v1/prestador
            strip_path: true

    # Plugins globais
    plugins:
      - name: correlation-id
        config:
          header_name: X-Correlation-Id
          generator: uuid
          echo_downstream: true

      # O cors responde ao preflight (OPTIONS) antes do jwt, então o navegador
      # consegue chamar as rotas protegidas a partir dos frontends.
      - name: cors
        config:
          origins:
            - http://localhost:3001
            - http://localhost:3002
          methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
          headers: [Accept, Authorization, Content-Type, Idempotency-Key, X-Correlation-Id]
          exposed_headers: [X-Correlation-Id, X-Pod-Name, Location, Retry-After, X-RateLimit-Limit-Minute, X-RateLimit-Remaining-Minute, X-RateLimit-Limit-Hour, X-RateLimit-Remaining-Hour]
          credentials: true
          max_age: 3600
