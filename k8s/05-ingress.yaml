# Entrada externa do cluster. Relação com o Gateway Routing da Parte 2 (docs/02):
#   - O Ingress NÃO substitui o Kong: ele só entrega o tráfego ao Service `kong`.
#   - É o Kong que valida JWT/ACL, aplica rate limit, injeta X-Correlation-Id e remove o prefixo
#     (strip_path) antes de chamar os BFFs. Assim o cluster tem o mesmo comportamento do docker-compose.
#   - Rotas: /v1/contratante/* -> kong -> bff-contratante   |   /v1/prestador/* -> kong -> bff-prestador
#
# Alternativa (NÃO usada): apontar cada path direto para bff-contratante / bff-prestador.
# Isso pularia JWT, rate limit e correlation-id, e exigiria rewrite-target no próprio Ingress.
#
# Requer um controller instalado (ingress-nginx): ver k8s/README.md.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resolvelar-ingress
  namespace: resolvelar
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /v1/contratante
            pathType: Prefix
            backend:
              service:
                name: kong
                port: {number: 8000}
          - path: /v1/prestador
            pathType: Prefix
            backend:
              service:
                name: kong
                port: {number: 8000}
