apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: resolvelar
spec:
  replicas: 1
  selector:
    matchLabels: {app: rabbitmq}
  template:
    metadata:
      labels: {app: rabbitmq}
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management-alpine
          ports:
            - {containerPort: 5672, name: amqp}
            - {containerPort: 15672, name: management}
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom: {secretKeyRef: {name: resolvelar-secrets, key: RABBITMQ_DEFAULT_USER}}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: {secretKeyRef: {name: resolvelar-secrets, key: RABBITMQ_DEFAULT_PASS}}
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10      # padrão era 1s: o ping demora mais que isso no primeiro boot
            failureThreshold: 6
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 1000m, memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: resolvelar
spec:
  selector: {app: rabbitmq}
  ports:
    - {name: amqp, port: 5672, targetPort: 5672}
    - {name: management, port: 15672, targetPort: 15672}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: resolvelar
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: resolvelar
spec:
  selector: {app: redis}
  ports:
    - {port: 6379, targetPort: 6379}

# ===================================================================
# PostgreSQL — database per service (um Deployment + PVC + Service por banco).
# Credenciais vêm do Secret `resolvelar-secrets`. Enquanto os ms-* não estão no cluster,
# nenhum serviço consome estes bancos ainda.
# ===================================================================
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-prestadores-write
  namespace: resolvelar
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-prestadores-write
  namespace: resolvelar
spec:
  replicas: 1
  strategy:
    type: Recreate        # volume RWO: nunca dois pods no mesmo disco
  selector:
    matchLabels: {app: db-prestadores-write}
  template:
    metadata:
      labels: {app: db-prestadores-write}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: prestadores_write
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: resolvelar-secrets, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: resolvelar-secrets, key: POSTGRES_PASSWORD_PRESTADORES_WRITE}}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pvc-prestadores-write
---
apiVersion: v1
kind: Service
metadata:
  name: db-prestadores-write
  namespace: resolvelar
spec:
  selector: {app: db-prestadores-write}
  ports:
    - {port: 5432, targetPort: 5432}
---
